name: Data refresh

on:
  schedule:
    # mondays: last week's days are closed by then
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # stdlib only; DuckDB is needed just for a --full rebuild
      - run: python scripts/build_dataset.py
      - name: Commit dataset if it changed
        run: |
          git diff --quiet public/data && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore(data): refresh ree daily dataset'
          git push
